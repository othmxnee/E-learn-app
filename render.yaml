services:
  # Express API
  - type: web
    name: elearn-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # MongoDB Atlas connection string. Render has no managed MongoDB, so this
      # one is filled in by hand when the blueprint is created.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: elearn-web
          property: host
    # Uploaded course material and submissions are written to backend/uploads,
    # which is wiped on every deploy and restart. Uncomment to keep them; a disk
    # requires a paid instance type (plan: starter or above).
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 1

  # React (Vite) single-page app
  - type: web
    name: elearn-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: elearn-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
