services:
  # Express API
  - type: web
    name: elearn-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Postgres connection string. The instance lives outside this blueprint,
      # so the value is filled in by hand when the blueprint is created.
      - key: DATABASE_URL
        sync: false
      # Tables are namespaced so the database can be shared with another app.
      - key: DB_SCHEMA
        value: elearn
      - key: JWT_SECRET
        generateValue: true
      # Powers the course assistant: embeddings for the search index and the
      # chat model itself. Filled in by hand — without it the app runs normally
      # and the assistant hides itself.
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: elearn-web
          property: host
    # Uploaded course material and submissions are written to backend/uploads,
    # which is wiped on every deploy and restart. Uncomment to keep them; a disk
    # requires a paid instance type (plan: starter or above).
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 1

  # React (Vite) single-page app
  - type: web
    name: elearn-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: elearn-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
